/* ============================================================

const THEMES={
 Midnight:{bg:"#0D1025",card:"#1A2040",border:"#242C4E",text:"#E6E9F0",muted:"#7C8498",accent:"#2EE5C8"},

 DeepBlue:{bg:"#020B18",card:"#061A2E",border:"#0D3557",text:"#D6E8F7",muted:"#6485A3",accent:"#2368B8"}
};
const COLORS=[
 ["cyan","#2EE5C8"],["magenta","#E9408A"],["amarillo","#FFD23F"],["verde","#2ECC71"],
 ["naranja","#FF7A45"],["violeta","#9B59FF"],["rojo","#FF4D4D"],["azul","#4D8AFF"]
];
const PHASES=["Idea","Grabando","Mezclando","Masterizado","Lanzado"];
const WORKFLOWS=[["Composición","🎼"],["Grabación","🎙️"],["Mezcla","🎛️"],["Masterización","💿"],["Distribución","🚀"],["Promoción","📣"],["Administrativo","🗂️"],["Otro","✦"]];
const TONES=[
 ["soft","Soft Bell",523],
 ["pulse","Pulse",440],
 ["chime","Chime",659],
 ["pop","Pop",880],
 ["deep","Deep",220],
 ["bright","Bright",1046],
 ["classic","Classic Alarm",880],

 {offset:-21,label:"Upload to distributor",short:"Upload",desc:"Portada + ISRC",range:[-21,-18]},
 {offset:-14,label:"Pitch playlists",short:"Pitch",desc:"Pitch editorial",range:[-17,-11]},
 {offset:-7,label:"Cover art",short:"Cover",desc:"Teasers + prensa",range:[-10,-6]},

function localDateISO(d=new Date()){

function stripProjectPrefix(v){return String(v??"").replace(/^\[.*?\]\s*/,"")}

function saveLocal(){try{localStorage.setItem("kanbanReconstruction",JSON.stringify(localPayload()))}catch{}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem("kanbanReconstruction")||"null");if(x){state.theme=x.theme||state.theme;state.projects=Array.isArray(x.projects)?x.projects:[];state.tasks=Array.isArray(x.tasks)?x.tasks:[]}}catch{}}

async function putHandle(handle){return new Promise((resolve,reject)=>{try{const req=indexedDB.open(HANDLE_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(HANDLE_STORE))req.result.createObjectStore(HANDLE_STORE)};req.onsuccess=()=>{const db=req.result,tx=db.transaction(HANDLE_STORE,"readwrite");tx.objectStore(HANDLE_STORE).put(handle,"file");tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}};req.onerror=()=>reject(req.error)}catch(err){reject(err)}})}
async function getHandle(){return new Promise(resolve=>{try{const req=indexedDB.open(HANDLE_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(HANDLE_STORE))req.result.createObjectStore(HANDLE_STORE)};req.onsuccess=()=>{const db=req.result,tx=db.transaction(HANDLE_STORE,"readonly"),r=tx.objectStore(HANDLE_STORE).get("file");r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();resolve(null)}};req.onerror=()=>resolve(null)}catch{resolve(null)}})}
async function deleteHandle(){try{await new Promise(resolve=>{const r=indexedDB.deleteDatabase(HANDLE_DB);r.onsuccess=r.onerror=r.onblocked=()=>resolve()})}catch{}}
async function writeHandle(handle,text){try{if(!handle)return false;const writable=await handle.createWritable();await writable.write(text);await writable.close();return true}catch(err){console.error("write fail",err);return false}}
async function handlePermission(handle,request=false){if(!handle||typeof handle.queryPermission!=="function")return true;try{let p=await handle.queryPermission({mode:"readwrite"});if(p==="granted")return true;if(request){p=await handle.requestPermission({mode:"readwrite"});return p==="granted"}}catch{}return false}
async function readHandle(handle){try{const file=await handle.getFile();const text=await file.text();const data=JSON.parse(text);if(Array.isArray(data.projects))state.projects=data.projects;if(Array.isArray(data.tasks))state.tasks=data.tasks;return true}catch(err){console.warn("No se pudo leer el JSON vinculado",err);return false}}
async function hydrateLinkedFile(){if(typeof indexedDB==="undefined")return;state.linkedLoading=true;render();try{const h=await getHandle();if(!h){state.linkedLoading=false;render();return}const ok=await handlePermission(h,false);if(ok){state.fileHandle=h;const read=await readHandle(h);if(read){saveLocal();toast(`📂 Cargado desde ${h.name}`)}}else{state.fileHandle=null}}catch(err){console.warn(err)}state.linkedLoading=false;render()}

function queueAutoSave(){saveLocal();if(!state.fileHandle||state.projects.length===0&&state.tasks.length===0)return;clearTimeout(queueAutoSave.timer);queueAutoSave.timer=window.setTimeout(async()=>{if(await handlePermission(state.fileHandle,false)){const ok=await writeHandle(state.fileHandle,serializeData());if(!ok)toast("⚠️ No se pudo actualizar el archivo vinculado")} },600)}
async function chooseSaveHandle(){if(typeof window.showSaveFilePicker!=="function")return null;try{return await window.showSaveFilePicker({suggestedName:"kanban-proyectos.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]})}catch(err){return null}}
async function saveJSON(forcePicker=false){const data=serializeData();
 if(!forcePicker&&state.fileHandle){if(await handlePermission(state.fileHandle,true)){if(await writeHandle(state.fileHandle,data)){toast(`💾 Actualizado en ${state.fileHandle.name}`);return true}return false}}
 if(typeof window.showSaveFilePicker==="function"){
  const h=await chooseSaveHandle();
  if(h){state.fileHandle=h;await putHandle(h);if(await writeHandle(h,data)){toast(`📁 Guardado en: ${h.name}`);render();return true}}
 }
 const now=new Date(),pad=n=>String(n).padStart(2,"0"),filename=`kanban-proyectos.json`;
 downloadJSON(data,filename);state.noFs=typeof window.showSaveFilePicker!=="function";render();return true;
}
function quickBackup(){const data=serializeData();const d=new Date(),p=n=>String(n).padStart(2,"0");downloadJSON(data,`kanban-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}-${p(d.getMinutes())}.json`);toast("☑ Backup rápido creado")}
async function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);state.projects=Array.isArray(x.projects)?x.projects:[];state.tasks=Array.isArray(x.tasks)?x.tasks:[];state.onboarding=false;try{localStorage.setItem("hasSeenOnboarding","true")}catch{}saveLocal();render();toast("📂 JSON importado");queueAutoSave()}catch{alert("JSON inválido")}};reader.readAsText(file)}
async function unlinkFile(){await deleteHandle();state.fileHandle=null;toast("🔓 Desvinculado");render()}

function reminderTasks(project,date){const base=new Date(`${date}T12:00:00`);const mk=(offset,title,workflow)=>{const d=new Date(base);d.setDate(d.getDate()+offset);return{id:id(),date:localDateISO(d),time:"10:00",kind:"Recordatorio",workflow,title:`[${project.name}] ${title}`,longNotes:"",done:false,projectId:project.id,color:project.color,reminders:[{type:"atTime"},{type:"d7"},{type:"h24"}],tone:"chime",autoChecklist:"release",taskGroup:"release-checklist"}};return[
 mk(-21,"Definir portada + metadata (ISRC / créditos)","Distribución"),
 mk(-14,"Subir a distribuidora y revisar stores","Distribución"),
 mk(-14,"Pitch editorial Spotify for Artists","Promoción"),
 mk(-10,"Teasers redes + pre-save link","Promoción"),
 mk(-7,"Enviar a prensa / curadores + mailing","Promoción"),
 mk(-5,"Revisar master final y loudness","Masterización"),
 mk(-3,"Check copyright / splits / contratos","Administrativo"),

]}

function newProject(){state.projectModal={id:id(),name:"",bpm:120,key:"C m",phase:"Idea",releaseDate:"",notes:"",color:"cyan",emoji:"🎧",createdAt:new Date().toISOString()};render()}
async function saveProject(p){if(!p||!p.name.trim())return;const now=new Date().toISOString();const project={...p,createdAt:p.createdAt||now};const existing=state.projects.some(x=>x.id===project.id);const first=state.projects.length===0;
 if(first&&!existing&&!state.fileHandle){
   if(typeof window.showSaveFilePicker==="function"){
     const h=await chooseSaveHandle();if(h){state.fileHandle=h;await putHandle(h);await writeHandle(h,JSON.stringify({version:"2.0-music",projects:[project],tasks:state.tasks,createdAt:new Date().toISOString()},null,2));toast(`📁 Guardado en: ${h.name} - Ahora tu proyecto vivirá aquí`)}
   }else{downloadJSON(JSON.stringify({version:"2.0-music",projects:[project],tasks:state.tasks,createdAt:new Date().toISOString()},null,2));state.noFs=true}
 }
 if(existing)state.projects=state.projects.map(x=>x.id===project.id?project:x);else{state.projects=[...state.projects,project];const d=project.createdAt.slice(0,10),time=new Date(project.createdAt).toTimeString().slice(0,5);state.tasks=[...state.tasks,{id:id(),date:d,time,kind:"Registro",workflow:"Administrativo",title:`📁 Proyecto creado: ${project.name} — ${project.bpm} BPM — ${project.key}`,longNotes:`Creado el ${fmtDate(d)}`,done:false,projectId:project.id,color:project.color,reminders:[],tone:"soft"}]}
 state.projectModal=null;queueAutoSave();render();
}
function deleteProject(pid){if(!confirm("¿Eliminar este proyecto y sus tareas?"))return;state.projects=state.projects.filter(x=>x.id!==pid);state.tasks=state.tasks.filter(x=>x.projectId!==pid);state.timelineProject="";queueAutoSave();render()}
function isCreationTask(t){return t?.kind==="Registro" && typeof t?.title==="string" && t.title.startsWith("📁 Proyecto creado:")}
function checklistTasksForProject(pid){return state.tasks.filter(t=>t.projectId===pid && t.autoChecklist==="release")}
function hasReleaseChecklist(pid){return state.tasks.some(t=>t.projectId===pid && (t.autoChecklist==="release" || (typeof t.title==="string" && (t.title.includes("Definir portada + metadata") || t.title.includes("Subir a distribuidora y revisar stores") || t.title.includes("Pitch editorial Spotify for Artists")))))}
function makeChecklist(pid){const p=state.projects.find(x=>x.id===pid);if(!p?.releaseDate){alert("Poné fecha de lanzamiento para generar checklist");return}if(hasReleaseChecklist(pid)){toast("✅ El checklist ya fue generado para este proyecto");return}state.tasks=[...state.tasks,...reminderTasks(p,p.releaseDate)];queueAutoSave();render();toast("🔔 Checklist -21→0 generado")}
function newTask(date=state.selectedDate){state.taskModal={id:id(),date:date||localDateISO(),time:"10:00",kind:"Recordatorio",workflow:"Composición",title:"",longNotes:"",done:false,projectId:state.projects[0]?.id||"",color:state.projects[0]?.color||"cyan",reminders:[{type:"atTime"},{type:"h24"},{type:"d7"}],tone:"chime"};render()}
function saveTask(t){if(!t||!t.title.trim())return;const x={...t,projectId:t.projectId||undefined,color:t.color||colorHex("cyan"),reminders:t.kind==="Recordatorio"&&t.date&&(!t.reminders||t.reminders.length===0)?[{type:"atTime"}]:(t.reminders||[])};if(state.tasks.some(y=>y.id===x.id))state.tasks=state.tasks.map(y=>y.id===x.id?x:y);else state.tasks=[...state.tasks,x];state.taskModal=null;queueAutoSave();render()}
function toggleTask(tid){state.tasks=state.tasks.map(t=>t.id===tid?({...t,done:!t.done}):t);queueAutoSave();render()}
function deleteTask(tid){
 const t=state.tasks.find(x=>x.id===tid);
 if(!t)return;
 if(!confirm(`¿Eliminar la tarea "${stripProjectPrefix(t.title)}"?`))return;
 stopAlarmPulse();
 if(state.alarmTask?.id===tid){state.alarmTask=null;state.alarmProgress=0}

function monthDays(){const y=state.month.getFullYear(),m=state.month.getMonth(),n=new Date(y,m+1,0).getDate(),a=[];for(let i=1;i<=n;i++)a.push(new Date(y,m,i));return a}
function groupWeeks(days){if(!days.length)return[];const first=days[0];const mondayOffset=(first.getDay()+6)%7;const cells=Array(mondayOffset).fill(null).concat(days);while(cells.length%7)cells.push(null);const out=[];for(let i=0;i<cells.length;i+=7)out.push(cells.slice(i,i+7));return out}
function tasksForDate(d){return state.tasks.filter(t=>t.date===d)}

function miniCalendar(){
 const y=state.miniMonth.getFullYear(),m=state.miniMonth.getMonth();
 const first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;
 const cells=Array(offset).fill(null);for(let i=1;i<=daysIn;i++)cells.push(new Date(y,m,i));while(cells.length%7)cells.push(null);
 const releaseProjects=state.projects.filter(p=>p.releaseDate);
 const selectedRelease=releaseProjects.find(p=>p.id===state.timelineProject)||releaseProjects[0];
 const releaseTasks=selectedRelease?checklistTasksForProject(selectedRelease.id):[];
 const releaseDone=releaseTasks.filter(t=>t.done).length;

 return `<div class="card mini-calendar-card"><div class="mini-cal-head"><div><div class="mono mini-kicker">MAPA RÁPIDO</div><div class="mini-month-title">${state.miniMonth.toLocaleDateString("es-AR",{month:"long",year:"numeric"})}</div></div><div class="mini-cal-nav"><button class="small-btn" onclick="shiftMiniMonth(-1)">‹</button><button class="small-btn" onclick="shiftMiniMonth(1)">›</button></div></div><div class="mini-weekdays">${["L","M","X","J","V","S","D"].map((x,i)=>`<span class="${i>4?"weekend": ""}">${x}</span>`).join("")}</div><div class="mini-days">${cells.map(d=>{if(!d)return `<span class="mini-day empty"></span>`;const ds=localDateISO(d),ts=tasksForDate(ds),done=ts.filter(t=>t.done).length,weekend=d.getDay()===0||d.getDay()===6;return `<button class="mini-day ${weekend?"weekend":""} ${ds===state.selectedDate?"selected":""} ${ts.length?"has-tasks":""}" onclick="selectMiniDate('${ds}')" title="${ts.length?`${ts.length} tarea(s)`:"Sin tareas"}"><span>${d.getDate()}</span>${ts.length?`<i class="mini-task-dots">${ts.slice(0,3).map(t=>`<b style="background:${colorHex(t.color)}"></b>`).join("")}</i>`:""}</button>`}).join("")}</div><div class="mini-legend"><span><i class="legend-dot task"></i>Tareas</span><span><i class="legend-dot done"></i>Hechas</span><span><i class="legend-dot weekend"></i>Fin de semana</span></div><div class="mini-timeline"><div class="row"><span class="mono">TIMELINE</span><strong>${releasePct}%</strong></div><div class="mini-progress"><i style="width:${releasePct}%"></i></div><div class="muted mini-timeline-copy">${selectedRelease?`${esc(selectedRelease.name)} · ${releaseDone}/${releaseTasks.length} checklist`:`Sin release timeline activo`}</div></div></div>`;
}

let touchDrag={timer:null,active:false,id:null,el:null,pointerId:null};
function touchDragStart(e,pid){
 if(e.pointerType!=="touch"&&e.pointerType!=="pen")return;
 if(e.target.closest("button,a,input,select,textarea"))return;
 touchDragClear();
 touchDrag.id=pid;touchDrag.el=e.currentTarget;touchDrag.pointerId=e.pointerId;
 touchDrag.timer=window.setTimeout(()=>{touchDrag.active=true;touchDrag.el.classList.add("touch-dragging");try{touchDrag.el.setPointerCapture(e.pointerId)}catch{};navigator.vibrate?.(30)},420);
}
function touchDragMove(e){
 if(!touchDrag.active)return;
 e.preventDefault();
 if(e.stopPropagation)e.stopPropagation();
 const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".column");
 document.querySelectorAll(".column.touch-drop-target").forEach(x=>x.classList.remove("touch-drop-target"));
 if(el)el.classList.add("touch-drop-target");
}
function touchDragEnd(e){
 if(!touchDrag.active){touchDragClear();return;}
 e.preventDefault();
 if(e.stopPropagation)e.stopPropagation();
 const col=document.elementFromPoint(e.clientX,e.clientY)?.closest(".column");
 const phase=col?.dataset.phase;
 const pid=touchDrag.id;
 touchDragClear();
 if(phase&&pid){state.projects=state.projects.map(p=>p.id===pid?({...p,phase}):p);queueAutoSave();render();toast(`↔ Fase cambiada a ${phase}`)}
}
function touchDragCancel(){touchDragClear()}
function touchDragClear(){if(touchDrag.timer)clearTimeout(touchDrag.timer);document.querySelectorAll(".column.touch-drop-target").forEach(x=>x.classList.remove("touch-drop-target"));if(touchDrag.el)touchDrag.el.classList.remove("touch-dragging");touchDrag={timer:null,active:false,id:null,el:null,pointerId:null}}

function renderKanban(){return `<!-- Kanban --><div><div class="row view-head"><h2 class="view-title">KANBAN — 5 fases</h2><button class="action-btn" onclick="newProject()">+ Proyecto</button></div><div class="kanban">${PHASES.map(p=>{const ps=state.projects.filter(x=>x.phase===p);return `<div class="column" data-phase="${p}" ondragover="event.preventDefault()" ondrop="dropPhase('${p}')"><div class="row" style="justify-content:flex-start;gap:8px"><span class="phase ${phaseClass(p)}">${p.toUpperCase()}</span><span class="muted" style="font-size:10px">${ps.length}</span></div>${ps.map(x=>{const ts=state.tasks.filter(t=>t.projectId===x.id),done=ts.filter(t=>t.done).length,c=colorHex(x.color),hasChecklist=hasReleaseChecklist(x.id);return `<div class="project-card" draggable="true" ondragstart="dragProject(event,'${x.id}')" onpointerdown="touchDragStart(event,'${x.id}')" onpointermove="touchDragMove(event)" onpointerup="touchDragEnd(event)" onpointercancel="touchDragCancel()"><div class="row"><span class="dot" style="width:8px;height:8px;background:${c}"></span><span class="project-name">${esc(x.emoji)} ${esc(x.name)}</span></div><div class="chips"><span class="chip" style="color:${c};border-color:${c}66">${x.bpm} BPM</span><span class="chip">${esc(x.key)}</span></div><div class="row muted" style="font-size:9px;margin-top:8px"><span>${done}/${ts.length}</span><span>${x.releaseDate?fmtDate(x.releaseDate):""}</span></div><div class="progress" style="width:100%;margin-top:4px"><i style="width:${ts.length?done/ts.length*100:0}%;background:${c}"></i></div><div class="muted" style="font-size:9px;margin-top:4px">Creado: ${fmtDate((x.createdAt||"").slice(0,10))}</div><div class="project-actions"><button class="outline-btn" onclick="editProject('${x.id}')">Editar</button><button class="outline-btn" ${hasChecklist?'disabled title="Checklist ya generado"':''} onclick="makeChecklist('${x.id}')">${hasChecklist?'✅ Checklist creado':'Checklist'}</button><select class="mobile-kanban-move" aria-label="Mover proyecto" onchange="moveProjectTo(this,'${x.id}')"><option value="">Mover a…</option>${PHASES.map(ph=>`<option value="${ph}" ${x.phase===ph?'selected':''}>${ph}</option>`).join("")}</select></div></div>`}).join("")}${ps.length===0?`<div class="muted" style="font-size:10px;text-align:center;padding:24px 0">Arrastrá acá</div>`:""}</div>`}).join("")}</div></div>`}
function renderProjects(){const term=state.search.trim().toLowerCase(),ps=state.projects.filter(p=>(p.name+" "+(p.notes||"")).toLowerCase().includes(term));return `<!-- Projects --><div><div class="row view-head"><div class="row" style="justify-content:flex-start"><input id="projectSearch" class="search" value="${esc(state.search)}" oninput="state.search=this.value;renderProjectsOnly()" placeholder="Buscar proyectos..."><span class="task-count">${ps.length}</span></div><button class="action-btn" onclick="newProject()">+ Proyecto</button></div><div class="projects-grid">${ps.map(p=>{const ts=state.tasks.filter(t=>t.projectId===p.id),c=colorHex(p.color);return `<div class="project-list-card"><div class="row" style="align-items:flex-start"><div style="min-width:0;flex:1"><div class="row" style="justify-content:flex-start"><span class="dot" style="width:10px;height:10px;background:${c}"></span><b style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.emoji)} ${esc(p.name)}</b><span class="phase ${phaseClass(p.phase)}">${p.phase}</span></div><div class="chips"><span class="chip">${p.bpm} BPM • ${esc(p.key)}</span>${p.releaseDate?`<span class="chip">🚀 ${fmtDate(p.releaseDate)}</span>`:""}<span class="chip">📅 Creado: ${fmtDate((p.createdAt||"").slice(0,10))}</span></div></div><div><button class="small-btn" onclick="editProject('${p.id}')">✏️</button> <button class="small-btn" onclick="deleteProject('${p.id}')">🗑️</button></div></div>${p.notes?`<div class="muted" style="font-size:11px;line-height:1.5;margin-top:8px;white-space:pre-wrap">${esc(p.notes)}</div>`:""}<div class="row" style="margin-top:8px"><span class="muted" style="font-size:10px">${ts.filter(t=>t.done).length}/${ts.length} • ${ts.filter(t=>!t.done).length} pend.</span><div><button class="outline-btn" onclick="state.selectedDate='${p.releaseDate||localDateISO()}';state.view='cal';render()">Calendario</button> ${p.releaseDate?`<button class="outline-btn" style="color:${c}" onclick="state.timelineProject='${p.id}';state.view='timeline';render()">Timeline →</button>`:""}</div></div></div>`}).join("")}${ps.length===0?`<div class="muted" style="grid-column:1/-1;text-align:center;padding:48px;font-size:12px">Sin resultados</div>`:""}</div></div>`}
function renderProjectsOnly(){const host=document.getElementById("viewMain");if(!host||state.view!=="projects"){render();return}const oldInput=document.getElementById("projectSearch"),caret=oldInput?oldInput.selectionStart:null;host.innerHTML=renderProjects();const next=document.getElementById("projectSearch");if(next){next.focus();if(caret!==null)try{next.setSelectionRange(caret,caret)}catch{}}}

function renderTimeline(){const dated=state.projects.filter(p=>p.releaseDate);if(!dated.length)return `<!-- Release Timeline --><div><div class="row view-head"><h2 class="view-title">RELEASE TIMELINE — vista real -21→0</h2><button class="action-btn" onclick="newProject()">+ Proyecto</button></div><div class="timeline-empty card"><div class="empty-icon">🚀</div><div class="empty-title">Necesitás un proyecto con fecha de lanzamiento</div><div class="empty-copy">Poné release date al crear proyecto y generá checklist -21→0. El timeline aparece automáticamente con 5 nodos, círculos cyan y logs.</div><button class="action-btn" style="margin-top:16px" onclick="newProject()">+ Crear proyecto con release</button></div></div>`;const p=dated.find(x=>x.id===state.timelineProject)||dated[0];state.timelineProject=p.id;const ts=checklistTasksForProject(p.id).sort((a,b)=>(a.date||"").localeCompare(b.date||""));const daysLeft=daysBetween(p.releaseDate,localDateISO()),done=ts.filter(t=>t.done).length,pct=ts.length?Math.round(done/ts.length*100):0,overdue=ts.filter(t=>!t.done&&t.date<localDateISO()).length,risk=overdue===0?"Low":daysLeft<3?"High":overdue>1?"Medium":"Low";const nodes=TIMELINE_NODES.map(n=>{const assigned=ts.filter(t=>{const d=daysBetween(t.date,p.releaseDate);return d>=n.range[0]&&d<=n.range[1]}),dn=assigned.filter(t=>t.done).length,np=assigned.length?Math.round(dn/assigned.length*100):0,status=assigned.length===0?"Scheduled":np===100?"Completed":np>0?"In progress":"Scheduled";return {...n,assigned,doneN:dn,totalN:assigned.length,pct:np,status}});return `<!-- Release Timeline --><div class="timeline-page"><div class="row view-head"><div><h2 class="view-title">RELEASE TIMELINE — vista real -21→0</h2><div class="muted" style="font-size:10px;margin-top:3px">MUSIC RELEASE CHECKLIST AUTOMATION</div></div><div style="display:flex;gap:8px;align-items:center">${dated.length>1?`<select class="search" style="width:220px" onchange="state.timelineProject=this.value;render()">${dated.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.emoji)} ${esc(x.name)}</option>`).join("")}</select>`:""}<button class="action-btn" onclick="newProject()">+ Proyecto</button></div></div>
<div class="timeline-hero card"><div class="row" style="align-items:flex-start"><div><div class="mono" style="font-size:11px;letter-spacing:.18em;color:var(--color-accent)">MUSIC RELEASE CHECKLIST AUTOMATION</div><h2 style="margin:5px 0 0;font-size:22px;line-height:1.1">Release Timeline — ${esc(p.emoji)} ${esc(p.name)}</h2><div class="muted" style="font-size:11px;margin-top:8px"><span class="chip">${p.bpm} BPM • ${esc(p.key)} • ${esc(p.phase)}</span> <span style="margin-left:8px">Release: <b style="color:var(--color-text)">${fmtDate(p.releaseDate)}</b></span> • <span>Countdown: <b style="color:${daysLeft<=0?"#2ECC71":"var(--color-text)"}">${daysLeft>0?`${daysLeft} days left`:daysLeft===0?"Today is 0 days — RELEASE DAY":`${Math.abs(daysLeft)} days ago`}</b></span></div><div class="mono muted" style="font-size:10px;margin-top:6px">Today is 0 days • ${localDateISO()} • ${ts.length} tasks • ${pct}% complete</div></div><span class="timeline-percent" style="border-color:${colorHex(p.color)}55;color:${colorHex(p.color)}">Informativa • ${pct}%</span></div>
<div class="timeline-nodes">${nodes.map(n=>{const completed=n.status==="Completed",progress=n.status==="In progress";return `<div class="timeline-node-wrap"><div class="timeline-node-dot ${completed?"completed":progress?"progressing":""}">${completed?"✓":progress?`${n.pct}%`:""}</div><div class="mono timeline-offset">${n.offset===0?"0 days":`${n.offset} days`}</div><div class="timeline-label">${n.label}</div><div class="timeline-desc">${n.desc}</div><div class="timeline-status ${completed?"done":progress?"progressing":""}">${n.status}${progress?` • ${n.pct}%`:(!completed&&n.totalN?` • ${n.doneN}/${n.totalN}`:"")}</div><div class="node-task-dots">${n.assigned.map(t=>`<span title="${esc(stripProjectPrefix(t.title))}" style="background:${t.done?"#2EE5C8":"var(--color-border)"}"></span>`).join("")}</div></div>`}).join("")}</div></div>
<div class="timeline-lower"><section class="card"><div class="row"><div><div class="mono" style="font-size:11px;font-weight:900;letter-spacing:.12em">CHECKLIST • -21 → 0 DÍAS</div><div class="muted" style="font-size:9px;margin-top:3px">Solo tareas generadas por el checklist de lanzamiento de este proyecto</div></div><span class="task-count">${done}/${ts.length} done • ${pct}%</span></div><div class="checklist-scroll">${ts.map(t=>{const rel=daysBetween(t.date,p.releaseDate);return `<div class="release-task ${t.done?"done":""}"><button class="check ${t.done?"done":""}" onclick="toggleTask('${t.id}')">${t.done?"✓":""}</button><div class="release-task-body"><div class="release-task-row"><span>${workflowEmoji(t.workflow)}</span><button class="plain-link ${t.done?"done-text":""}" onclick="editTask('${t.id}')">${esc(stripProjectPrefix(t.title))}</button>${t.reminders?.length?"🔔":""}<span class="task-date">${rel>=0?`+${rel}d`:`${rel}d`} • ${t.date} ${t.time||""}</span></div><div><span class="chip">${esc(t.workflow)}</span><button class="plain-link muted" style="margin-left:8px" onclick="editTask('${t.id}')">edit</button></div></div></div>`}).join("")||`<div class="muted" style="padding:32px;text-align:center">Sin checklist — genera desde Proyectos → Checklist</div>`}</div></section><aside style="display:grid;gap:12px"><section class="card"><div class="mono" style="font-size:11px;font-weight:900;letter-spacing:.12em">LOG • ALARMAS PROGRAMADAS</div><div class="log-scroll">${ts.map(t=>{const rel=daysBetween(t.date,p.releaseDate);return `<div class="log-row"><span>${rel>=0?`+${rel}d`:`${rel}d`} ${t.time||"08:12"} 🔔</span><span>${esc(stripProjectPrefix(t.title))} ${t.done?"✓":"○"} • ${esc(t.workflow)}</span></div>`}).join("")||`<div class="muted">No logs yet</div>`}<div class="log-divider"></div><div class="muted">— Release engine initialized for ${esc(p.name)}</div><div class="muted">— ${ts.length} tasks mapped from -21 to 0 days</div><div class="muted">— Countdown sync: ${daysLeft} days to release</div></div></section><section class="card"><div class="mono" style="font-size:11px;font-weight:900;letter-spacing:.12em">SUMMARY</div><div class="summary-grid" style="margin-top:12px"><div class="metric"><small>PROGRESS</small><b>${done}/${ts.length}</b><small>${pct}% Tasks</small><div class="progress" style="width:100%;margin-top:8px"><i style="width:${pct}%;background:${colorHex(p.color)}"></i></div></div><div class="metric"><small>STATUS</small><b style="font-size:12px;color:${overdue===0?"#2ECC71":"#FF7A45"}">${overdue===0?"On track":"Attention needed"}</b><small>${overdue===0?"No overdue":`${overdue} overdue`}</small><div style="margin-top:8px;font-size:10px"><span class="risk-dot ${risk.toLowerCase()}"></span>${risk} Risk</div></div></div><div class="next-action"><span>Next action:</span><b>${esc(stripProjectPrefix(ts.find(t=>!t.done)?.title||"All done — ready to release 🚀"))}</b></div></section></aside></div></div>`}

;color:var(--color-muted)"><input type="checkbox" id="dontShowOnboarding" onchange="setOnboardingPreference(this.checked)"> No volver a mostrar este mensaje</label></div><div class="modal-actions"><button class="primary-btn" onclick="beginFirstProject()">Entendido, crear mi primer proyecto</button><label class="secondary-btn" style="display:grid;place-items:center;text-align:center">Ya tengo un JSON, importar<input hidden type="file" accept=".json" onchange="importJSON(this.files[0])"></label></div><div class="muted" style="font-size:10px;text-align:center;margin-top:10px">¿Estoy errado? No. Es así: local-first con permiso del navegador. Transparente.</div><div class="muted mono" style="font-size:9px;text-align:center;margin-top:6px">⚡ Al hacer click se abrirá inmediatamente el explorador de tu PC (Windows/Mac) para elegir carpeta</div></div></div>`}

function alarmModal(){const t=state.alarmTask;if(!t)return"";const prog=Math.max(0,Math.min(100,state.alarmProgress||0));return `<!-- Alarm --><div class="overlay alarm-overlay"><div class="alarm-modal"><div class="alarm-icon">⏰</div><h3 class="mono alarm-title">¡ALARMA! 🔔</h3><div class="alarm-task">${esc(t.title)}</div><div class="alarm-meta">${t.date} ${t.time||""} • ${workflowEmoji(t.workflow)} ${esc(t.workflow)}</div><div class="alarm-progress"><i style="width:${prog}%"></i></div><div class="modal-actions"><button class="primary-btn" onclick="dismissAlarm()">Desactivar</button><button class="secondary-btn" onclick="snoozeAlarm()">Posponer 5min</button></div></div></div>`}
function findDueAlarm(){const now=new Date(),date=localDateISO(now),time=now.toTimeString().slice(0,5);return state.tasks.find(q=>{if(q.done||!q.date||!q.time)return false;if(q.date===date&&q.time===time)return true;for(const r of q.reminders||[]){const base=new Date(`${q.date}T${q.time}`);let d=new Date(base);if(r.type==="h24")d=new Date(base.getTime()-86400000);if(r.type==="h12")d=new Date(base.getTime()-43200000);if(r.type==="d7")d=new Date(base.getTime()-604800000);if(r.type==="d14")d=new Date(base.getTime()-1209600000);if(r.type==="d21")d=new Date(base.getTime()-1814400000);if(d.toTimeString().slice(0,5)===time&&localDateISO(d)===date)return true}return false})}
function checkAlarms(){if(state.alarmTask)return;const due=findDueAlarm();if(!due)return;const key=`${due.id}|${localDateISO()}|${new Date().getHours()}:${new Date().getMinutes()}`;if(state.alarmDismissedKey===key)return;state.alarmTask=due;state.alarmProgress=0;render();playAlarmBurst(due.tone||"chime")}

let alarmPulseInterval=null,alarmPulseTimeout=null;

function dismissAlarm(){const t=state.alarmTask;if(t){state.alarmDismissedKey=`${t.id}|${localDateISO()}|${new Date().getHours()}:${new Date().getMinutes()}`};stopAlarmPulse();state.alarmTask=null;state.alarmProgress=0;render()}
function snoozeAlarm(){const t=state.alarmTask;if(!t)return;const d=new Date(`${t.date}T${t.time||"10:00"}`);d.setMinutes(d.getMinutes()+5);state.tasks=state.tasks.map(x=>x.id===t.id?{...x,date:localDateISO(d),time:d.toTimeString().slice(0,5)}:x);queueAutoSave();stopAlarmPulse();state.alarmTask=null;state.alarmProgress=0;render()}
function checkAlarmsStart(){if(alarmInterval)return;alarmInterval=window.setInterval(checkAlarms,30000);checkAlarms()}

let audioCtx=null;
function audioContext(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}
function beep(tone="chime",duration=.6){
 try{
  const ctx=audioContext();
  if(ctx.state==="suspended")ctx.resume();
  const master=ctx.createGain();
  master.gain.setValueAtTime(.0001,ctx.currentTime);
  master.gain.exponentialRampToValueAtTime(.48,ctx.currentTime+.012);
  master.connect(ctx.destination);

  const patterns={
   soft:[[523,.22]],
   pulse:[[440,.14],[0,.08],[440,.14]],
   chime:[[659,.18],[784,.18],[1046,.34]],
   pop:[[880,.11]],
   deep:[[220,.32]],
   bright:[[1046,.13],[1318,.18]],
   classic:[[880,.16],[660,.16],[880,.26]],
   double:[[880,.13],[0,.09],[880,.13],[0,.09],[880,.20]],
   digital:[[1046,.11],[1318,.11],[1046,.11],[1318,.22]],
   urgent:[[740,.11],[988,.11],[740,.11],[988,.11],[740,.11],[988,.24]],
   bell:[[784,.16],[988,.22],[1318,.34]],
   siren:[[700,.16],[1100,.16],[700,.16],[1100,.16],[700,.22]]
  };
  const pattern=patterns[tone]||patterns.chime;
  let t=ctx.currentTime;
  pattern.forEach(([freq,dur])=>{
   if(!freq){t+=dur;return;}
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.type=(tone==="deep"||tone==="soft"||tone==="chime"||tone==="bell")?"sine":"square";
   o.frequency.setValueAtTime(freq,t);
   g.gain.setValueAtTime(.0001,t);
   g.gain.exponentialRampToValueAtTime(.95,t+.008);
   g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.04,dur-.025));
   o.connect(g);g.connect(master);
   o.start(t);o.stop(t+dur+.035);
   t+=dur;
  });
  master.gain.exponentialRampToValueAtTime(.0001,t+.06);
  setTimeout(()=>{try{master.disconnect()}catch(e){}},Math.ceil((t-ctx.currentTime+.2)*1000));
 }catch(err){console.warn("audio unavailable",err)}
}
