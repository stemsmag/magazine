name: Optimizar imágenes

# Se dispara solo cuando el push toca alguna de las carpetas de imágenes
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "articulos/images/**"
      - "img/**"
      - "img-ev/**"

permissions:
  contents: write   # necesario para poder hacer commit + push de vuelta al repo

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Optimizar imágenes
        run: python3 scripts/optimize_images.py

      - name: Commit de imágenes optimizadas (si hubo cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images articulos/images img img-ev .image-optimize-cache.json
          git diff --staged --quiet || git commit -m "chore: optimizar imágenes automáticamente"
          git push
