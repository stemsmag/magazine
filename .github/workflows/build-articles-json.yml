name: Regenerar articles.json

on:
  push:
    branches: [main]
    paths:
      - "articulos/**.html"
      - "scripts/build_articles_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerar articles.json
        run: python3 scripts/build_articles_json.py

      - name: Commit si hubo cambios
        run: |
          if git diff --quiet -- articles.json; then
            echo "Sin cambios en articles.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "chore: regenerar articles.json [automático]"
            git push
          fi
