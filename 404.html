<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 — Señal perdida | STEMS Magazine</title>
<base href="/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Mr+Dafoe&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Ajusta estos valores a los hex exactos de tu sistema de diseño */
  :root{
    --noturno:#0a0a0f;
    --vulcanico:#c8431a;
    --turmeric:#e3a21a;
    --sage:#9bb08f;
    --texto:#ece8df;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 0%, #1a1208 0%, var(--noturno) 60%);
    color:var(--texto);
    font-family:'Work Sans',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem 1.25rem;overflow-x:hidden;
  }
  .tag{
    font-family:'Space Mono',monospace;font-size:.8rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--sage);margin-bottom:1rem;
  }
  .num{position:relative;line-height:.9}
  .num h1{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(7rem,28vw,20rem);letter-spacing:.02em;
    color:var(--turmeric);text-shadow:0 0 40px rgba(227,162,26,.25);
  }
  .num h1::before,.num h1::after{
    content:"404";position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;
  }
  .num h1::before{color:var(--vulcanico);transform:translate(-4px,0);animation:glitch 3.2s infinite steps(1)}
  .num h1::after{color:var(--sage);transform:translate(4px,0);animation:glitch 3.2s infinite steps(1) reverse}
  @keyframes glitch{
    0%,92%,100%{opacity:0;clip-path:inset(0 0 0 0)}
    93%{opacity:.8;clip-path:inset(20% 0 55% 0)}
    95%{opacity:.8;clip-path:inset(60% 0 10% 0)}
    97%{opacity:.8;clip-path:inset(35% 0 40% 0)}
  }
  .script{
    font-family:'Mr Dafoe',cursive;font-size:clamp(2rem,7vw,3.6rem);
    color:var(--texto);margin-top:-1.2rem;transform:rotate(-3deg);
  }
  p.msg{max-width:34rem;margin:1.5rem auto 0;color:#b9b4a8;line-height:1.6}
  .eq{display:flex;gap:6px;align-items:flex-end;height:48px;margin:2rem 0 1.5rem}
  .eq span{
    width:7px;background:var(--vulcanico);border-radius:2px;height:20%;
    animation:eq 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(odd){background:var(--turmeric)}
  .eq span:nth-child(3n){background:var(--sage)}
  .eq span:nth-child(1){animation-delay:-.9s}.eq span:nth-child(2){animation-delay:-.3s}
  .eq span:nth-child(3){animation-delay:-.7s}.eq span:nth-child(4){animation-delay:-.1s}
  .eq span:nth-child(5){animation-delay:-.5s}.eq span:nth-child(6){animation-delay:-.8s}
  .eq span:nth-child(7){animation-delay:-.2s}.eq span:nth-child(8){animation-delay:-.6s}
  .eq span:nth-child(9){animation-delay:-.4s}.eq span:nth-child(10){animation-delay:-1s}
  .eq span:nth-child(11){animation-delay:-.35s}.eq span:nth-child(12){animation-delay:-.75s}
  @keyframes eq{0%,100%{height:12%}50%{height:100%}}
  .actions{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center}
  .btn{
    font-family:'Space Mono',monospace;font-size:.85rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
    padding:.85rem 1.5rem;border:2px solid var(--turmeric);color:var(--noturno);
    background:var(--turmeric);transition:.2s;cursor:pointer;
  }
  .btn:hover{background:transparent;color:var(--turmeric)}
  .btn.ghost{background:transparent;color:var(--texto);border-color:var(--sage)}
  .btn.ghost:hover{background:var(--sage);color:var(--noturno)}
  .path{
    margin-top:2rem;font-family:'Space Mono',monospace;font-size:.75rem;
    color:#6f6b62;word-break:break-all;max-width:90vw;
  }
  .brand{
    position:fixed;top:1.25rem;left:0;right:0;text-align:center;
    font-family:'Anton',sans-serif;letter-spacing:.25em;color:var(--texto);
    text-decoration:none;font-size:1.1rem;
  }
  @media (prefers-reduced-motion:reduce){
    .eq span,.num h1::before,.num h1::after{animation:none}
  }
</style>
</head>
<body>
  <a class="brand" href="/">STEMS</a>

  <div class="tag">Error · Señal perdida</div>
  <div class="num"><h1>404</h1></div>
  <div class="script">esta pista no existe</div>

  <p class="msg">
    La página que buscas se movió, cambió de nombre o nunca salió del estudio.
    Vuelve al inicio y sigue descubriendo artistas emergentes de la música electrónica.
  </p>

  <div class="eq" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="actions">
    <a class="btn" href="/">Volver al inicio</a>
    <a class="btn ghost" href="javascript:history.back()">Página anterior</a>
  </div>

  <div class="path" id="path"></div>
  <script>
    document.getElementById('path').textContent = 'ruta solicitada: ' + location.pathname;
  </script>
</body>
</html>
